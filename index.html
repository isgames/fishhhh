<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roller Coaster Obby Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background: #231F20;">
    <div id="unity-container" style="position: width: 100%; height: 100%;">
        <canvas id="unity-canvas" width=100% height=100% tabindex="-1"></canvas>
        <div id="unity-loading-bar" style="display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;">
            <div id="unity-logo" style="width: 154px; height: 130px; background: url('TemplateData/unity-logo-dark.png') no-repeat center;"></div>
            <div id="unity-progress-bar-empty" style="width: 141px; height: 18px; margin-top: 10px; background: url('TemplateData/progress-bar-empty.png') no-repeat center;">
                <div id="unity-progress-bar-full" style="width: 0%; height: 18px; background: url('TemplateData/progress-bar-full.png') no-repeat center;"></div>
            </div>
        </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/CartRideObby.loader.js";
      var config = {
        dataUrl: buildUrl + "/CartRideObby.data.unityweb",
        frameworkUrl: buildUrl + "/CartRideObby.framework.js.unityweb",
        codeUrl: buildUrl + "/CartRideObby.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Roller Coaster Obby Race",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).zIndex = (message) => {
          console.error(message);
        };
      };
      document.body.appendChild(script);
    </script>
</body>
</html>
